[workspace]
resolver = "2"
members = [
    "crates/bitty-url-detector",
]
# The cargo-fuzz harness below is dev tooling only: a standalone crate with
# its own lockfile, excluded so workspace gates ignore its fuzzer deps.
exclude = ["fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/bitty-terminal/bitty-url-detector"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
